# Local-mode stack — runs entirely on your laptop. No SN Cloud, no terraform,
# no SA tokens. A streamnative/pulsar-all standalone container ships KoP +
# functions + auto-topic-creation built in; the rest of the stack auto-detects
# the no-auth setup and skips SASL / token mounts.
#
# Trade-off: local-mode does NOT exercise the auth + RBAC chain — the most
# fragile part of the system on real clusters. Use it for fast iteration on
# the multi-query app / queries / observability UI; use docker-compose.yml
# (cloud-mode) for any test that needs to validate permissions / audience /
# rolebinding behavior.
#
# Bring-up:
#   docker compose -f docker-compose.local.yml up --build
#
# Open <http://localhost:3200> once everything's healthy. Containers boot in
# this order: pulsar (~30s) → orchestrator-deploy (one-shot, ~20s) → bootstrap
# (one-shot, ~5s) → shadowtraffic + multi-query-app + observability.

services:
  pulsar:
    image: streamnative/sn-platform:4.0.10.1
    # streamnative/sn-platform doesn't ship a linux/arm64 manifest — force amd64
    # so Docker Desktop emulates it via Rosetta on Apple Silicon hosts. Slightly
    # slower startup (~10s extra) but otherwise transparent.
    platform: linux/amd64
    container_name: stock-demo-pulsar
    command:
      - /bin/bash
      - -c
      - |
        bin/apply-config-from-env.py conf/standalone.conf && \
        echo '=== KoP-relevant lines in standalone.conf ===' && \
        grep -iE 'kafkaEntryFormat|brokerEntryMetadata|exposingBrokerEntry' conf/standalone.conf && \
        echo '=== starting standalone ===' && \
        bin/pulsar standalone --advertised-address pulsar
    environment:
      # KoP — Kafka-on-Pulsar protocol handler. The streamnative/sn-platform
      # image ships the KoP NAR in protocols/. The PULSAR_PREFIX_ keys are
      # mapped into broker.conf by apply-config-from-env.
      PULSAR_PREFIX_messagingProtocols:                       "kafka"
      PULSAR_PREFIX_protocolHandlerDirectory:                 "./protocols"
      PULSAR_PREFIX_kafkaListeners:                           "PLAINTEXT://0.0.0.0:9092"
      PULSAR_PREFIX_kafkaAdvertisedListeners:                 "PLAINTEXT://pulsar:9092"
      PULSAR_PREFIX_kafkaEnableMultiTenantMetadata:           "true"
      PULSAR_PREFIX_kafkaTransactionCoordinatorEnabled:       "false"
      # NOTE: kafkaEntryFormat=pulsar_non_batched is NOT set here. At the
      # *broker* level, kafkaEntryFormat only accepts `pulsar` / `kafka`;
      # `pulsar_non_batched` is recognized only as a NAMESPACE-level property.
      # bootstrap.sh sets it on public/default via `namespaces set-property`
      # before the source topic is created so the topic inherits it. (An
      # earlier revision set it as broker config here — KoP silently fell
      # back to the default `pulsar` and every Kafka batch was stored as a
      # Pulsar batch, breaking the spawned filter's plain Pulsar consumer
      # with `SingleMessageMetadata: Some required fields are missing`.)
      # KoP computes Kafka offsets from broker-entry index metadata. Without
      # the AppendIndexMetadataInterceptor enabled, every fetch fails with
      # "No BrokerEntryMetadata found" and consumers get empty batches.
      # exposingBrokerEntryMetadataToClientEnabled lets the consumer read it
      # back. Both are documented KoP prerequisites the sn-platform image
      # doesn't enable by default in standalone mode.
      PULSAR_PREFIX_brokerEntryMetadataInterceptors:          "org.apache.pulsar.common.intercept.AppendIndexMetadataInterceptor"
      PULSAR_PREFIX_exposingBrokerEntryMetadataToClientEnabled: "true"
      # Functions — required for the orchestrator + spawned selector-filters.
      PULSAR_PREFIX_functionsWorkerEnabled:                   "true"
      PULSAR_PREFIX_allowAutoTopicCreation:                   "true"
      PULSAR_PREFIX_allowAutoTopicCreationType:               "non-partitioned"
      # Tame the heap so 2-4 GB laptops can run this.
      PULSAR_MEM:                                              "-Xms512m -Xmx1g -XX:MaxDirectMemorySize=1g"
    ports:
      - "8080:8080"     # admin
      - "6650:6650"     # pulsar binary protocol
      - "9092:9092"     # KoP Kafka protocol
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/admin/v2/clusters | grep -q standalone || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot: downloads the selector-filter + orchestrator NARs from the GitHub
  # release, uploads selector-filter as a Pulsar package, deploys the
  # orchestrator function. Equivalent to recreate.sh Phase 7 but for the local
  # standalone broker. Idempotent — re-running on an already-deployed cluster
  # skips the function-create step.
  orchestrator-deploy:
    image: apachepulsar/pulsar:4.0.5
    container_name: stock-demo-orchestrator-deploy
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      PULSAR_ADMIN_URL: "http://pulsar:8080"
      SELECTOR_REPO:    "${SELECTOR_REPO:-david-streamlio/broker-side-filtering-function}"
      SELECTOR_REL:     "${SELECTOR_REL:-v1.0.0}"
      # Required when SELECTOR_REPO is private (the default repo currently is).
      # Set with: export GITHUB_TOKEN=$(gh auth token).
      # Leave unset for public repos.
      GITHUB_TOKEN:     "${GITHUB_TOKEN:-}"
    volumes:
      - ./local/orchestrator-deploy.sh:/usr/local/bin/orchestrator-deploy.sh:ro
      - ./local/orchestrator-function-config.yaml:/etc/orchestrator-function-config.yaml:ro
      # Pre-download the NARs on the host (gh already has private-repo auth):
      #   gh release download v1.0.0 \
      #     --repo david-streamlio/broker-side-filtering-function \
      #     --dir demo/local/nars
      # orchestrator-deploy.sh uses these directly when present; otherwise it
      # falls back to an in-container download (public repos only).
      - ./local/nars:/nars:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/orchestrator-deploy.sh"]

  bootstrap:
    image: apachepulsar/pulsar:4.0.5
    container_name: stock-demo-bootstrap
    restart: "no"
    depends_on:
      orchestrator-deploy:
        condition: service_completed_successfully
    environment:
      PULSAR_ADMIN_URL:       "http://pulsar:8080"
      DEMO_SOURCE_TOPIC:      "persistent://public/default/stock-quotes"
      DEMO_CONTROL_TOPIC:     "persistent://public/default/filter-requests"
      DEMO_SOURCE_PARTITIONS: "1"
      # PULSAR_TOKEN_FILE intentionally unset — bootstrap.sh auto-detects no-auth.
    volumes:
      - ./bootstrap/bootstrap.sh:/usr/local/bin/bootstrap.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/bootstrap.sh"]

  shadowtraffic:
    image: shadowtraffic/shadowtraffic:latest
    container_name: stock-demo-shadowtraffic
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    # License vars (LICENSE_ID, LICENSE_EMAIL, LICENSE_ORGANIZATION,
    # LICENSE_EDITION, LICENSE_EXPIRATION, LICENSE_SIGNATURE) come from
    # license.env in this directory — see license.env.example for the shape.
    # license.env is gitignored so the actual values never get committed.
    env_file:
      - license.env
    volumes:
      # stock-quotes.local.json has the topic + bootstrap values hardcoded for
      # the standalone broker. ShadowTraffic doesn't do env-var substitution on
      # its config, so we mount a non-templated copy in local mode.
      - ./shadowtraffic/stock-quotes.local.json:/etc/shadowtraffic/stock-quotes.json:ro
    # Use the image's default entrypoint (which knows where the shadowtraffic
    # binary lives) — just pass the config-file flag as the command.
    command: ["--config", "/etc/shadowtraffic/stock-quotes.json"]

  multi-query-app:
    build:
      context: ..
      dockerfile: demo/multi-query-app/Dockerfile
    container_name: stock-demo-multi-query
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      shadowtraffic:
        condition: service_started
    environment:
      PULSAR_SERVICE_URL:  "pulsar://pulsar:6650"
      PULSAR_ADMIN_URL:    "http://pulsar:8080"
      KAFKA_BOOTSTRAP:     "pulsar:9092"
      DEMO_SOURCE_TOPIC:   "persistent://public/default/stock-quotes"
      DEMO_CONTROL_TOPIC:  "persistent://public/default/filter-requests"
      DEMO_QUERIES_PATH:   "/app/queries.yaml"
      # KAFKA_PASSWORD intentionally unset — MultiQueryDemo's buildKafkaProps
      # auto-detects this and uses PLAINTEXT instead of SASL_SSL.
    volumes:
      - ./multi-query-app/queries.yaml:/app/queries.yaml:ro

  observability:
    image: ghcr.io/david-streamlio/broker-side-filter-observability:${OBSERVABILITY_IMAGE_TAG:-0.1.2}
    # `pull_policy: missing` means Docker will only pull when no local image
    # with this tag exists. Lets contributors who built the image locally
    # (e.g. `docker tag broker-side-filter-observability:test ghcr.io/...:latest`)
    # run the demo without needing the GHCR package to be public, AND lets
    # the prod-style flow keep working once the GHCR package IS public.
    pull_policy: missing
    container_name: stock-demo-observability
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "3200:3200"
    environment:
      PULSAR_SERVICE_URL:         "pulsar://pulsar:6650"
      PULSAR_ADMIN_URL:           "http://pulsar:8080"
      STATE_TOPIC:                "persistent://public/default/orchestrator-state"
      ORCHESTRATOR_TENANT:        "public"
      ORCHESTRATOR_NAMESPACE:     "default"
      ORCHESTRATOR_FUNCTION:      "orchestrator"
      HEARTBEAT_MAX_STALE_SECONDS: "90"
      # No PULSAR_TOKEN_FILE — observability's PulsarConfig falls through
      # to no-auth when neither token nor oauth2 are configured.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3200/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
