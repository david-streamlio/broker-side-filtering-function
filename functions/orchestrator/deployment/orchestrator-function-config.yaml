tenant: public
namespace: filters
name: selector-filter-orchestrator
className: io.streamnative.filter.orchestrator.OrchestratorFunction
inputs:
  # The topic SDK clients publish their FilterRequests to. Configure your SDKs to point at this
  # same topic via Session.builder().controlTopic(...).
  - persistent://public/filters/filter-requests
processingGuarantees: ATLEAST_ONCE
parallelism: 1   # MUST be 1 — multiple orchestrator instances would race on spawn decisions.
userConfig:
  # Registry TableView state topic — orchestrator persists per-input-topic filter function
  # metadata and per-queryId fan-out indexes here. Should be compacted (orchestrator sets the
  # compactionThreshold at startup automatically when apply-compaction is true).
  state-topic: persistent://public/filters/orchestrator-state

  # Pulsar package URL for the selector-filter NAR. Upload once at deploy time:
  #   pulsar-admin packages upload \
  #       function://public/filters/selector-filter@1.0 \
  #       --path /path/to/selector-filter-function-VERSION.nar \
  #       --description "selector filter"
  function-package-url: function://public/filters/selector-filter@1.0

  # Tenant/namespace under which spawned filter functions are deployed. The orchestrator's
  # principal MUST have functions admin on this namespace.
  function-tenant: public
  function-namespace: filters

  # Tenant/namespace for the per-filter-function control topics. Defaults to function-tenant
  # / function-namespace if omitted.
  # function-control-topic-tenant: public
  # function-control-topic-namespace: filters

  # Parallelism applied to each spawned filter function (NOT the orchestrator's parallelism).
  function-parallelism: 1

  # Apply per-topic compactionThreshold on the registry state topic + each per-function control
  # topic. Required for bounded TableView replay on restart. Set to false only if the
  # orchestrator's principal lacks topic-policies admin and you've configured compaction at
  # namespace level instead.
  apply-compaction: true
  compaction-threshold-bytes: 10485760  # 10 MB

  # Pulsar HTTP admin URL the orchestrator uses to spawn filter functions (via
  # admin.functions().createFunctionWithUrl). Required — ctx.getPulsarAdmin() is only
  # available when the function worker is configured with pulsarFunctionsCluster, which many
  # deployments don't enable by default.
  pulsar-admin-url: http://broker:8080

  # ----------------------------------------------------------------------------
  # Idle filter GC (opt-in)
  # ----------------------------------------------------------------------------
  # When enabled, the orchestrator runs a background sweeper that deletes filter functions
  # whose queryIds have all UNREGISTERed for >= idle-gc-ttl-seconds. See the "Idle filter GC"
  # section in README.md for the full semantics and limits.
  #
  # Permissions when enabled: the orchestrator principal needs `delete` permission on the
  # per-function control topics under function-control-topic-tenant/namespace, in addition to
  # the standard functions-admin role. Without it, GC attempts log WARN and the t: entry
  # survives across sweep ticks.
  #
  # idle-gc-enabled: false                       # default: false (opt-in)
  # idle-gc-ttl-seconds: 300                     # default: 300 (5 minutes)
  # idle-gc-sweep-interval-seconds: 30           # default: 30

  # ----------------------------------------------------------------------------
  # Dead-consumer detection via SDK heartbeats
  # ----------------------------------------------------------------------------
  # When idle-gc is enabled, the orchestrator also uses heartbeat staleness to declare
  # queryIds dead and synthesize UNREGISTERs for them. The SDK Session publishes one
  # HEARTBEAT message every Session.builder().heartbeatIntervalSeconds() (default 30s)
  # listing all of its live queryIds. A queryId whose lastSeen is older than
  # heartbeat-max-stale-seconds gets a synthesized UNREGISTER, which empties activeQueryIds
  # on the corresponding t: entry and lets the idle-gc pass reclaim the filter.
  #
  # Total time from consumer death to filter deletion = max-stale + idle-gc-ttl + sweep slack.
  # Default (90 + 300 + ~10) ~= 6.5 minutes.
  #
  # heartbeat-max-stale-seconds: 90              # default: 90 (3 missed @ SDK default 30s)

  # ----------------------------------------------------------------------------
  # Continuous existence reconcile (opt-in)
  # ----------------------------------------------------------------------------
  # When enabled, the orchestrator runs a background loop that re-creates filter functions which
  # have gone MISSING (deleted out-of-band) while a live query still references them — the
  # "ensure desired filters exist" half of a Kubernetes-style controller. It does NOT restart
  # crashed-but-present instances (the Pulsar Functions runtime handles that, kubelet-style); it
  # only repairs absent function records. On repair it re-spawns idempotently and repopulates the
  # control topic from the selector persisted on each q: entry. Disjoint from idle GC: this loop
  # only touches in-use filters (non-empty activeQueryIds), the sweeper only idle ones.
  #
  # Permissions when enabled: the orchestrator principal needs the same functions-admin +
  # control-topic create/produce rights it uses for the initial spawn (it reuses the spawner).
  #
  # existence-reconcile-enabled: false           # default: false (opt-in)
  # existence-reconcile-interval-seconds: 60     # default: 60
  # existence-reconcile-max-attempts: 5          # default: 5 (consecutive failures before give-up)

  # ----------------------------------------------------------------------------
  # Spawned-filter output-producer batching (latency tuning)
  # ----------------------------------------------------------------------------
  # batchingMaxPublishDelayMs applied to every spawned filter's output producer. The Pulsar
  # Functions framework default dominates the filter's value-add latency (a matched message waits
  # up to this many ms before being flushed downstream). 1ms is a strong latency/throughput
  # balance; 0 disables batching (lowest latency, highest per-message send cost). Measured: this
  # is ~99.9% of the filter's value-add latency at 10-100 selectors (see SelectorScalingBench).
  # filter-output-batch-max-publish-delay-ms: 1  # default: 1 (0 = batching disabled)
resources:
  cpu: 1.0
  ram: 1073741824   # 1GB
