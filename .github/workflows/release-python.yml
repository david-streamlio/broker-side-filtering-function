name: Release Python SDK

# Builds the Python SDK (sdk/python) once, then publishes it. Two entry points:
#
#   - push a v* tag  -> attaches the wheel/sdist to the GitHub Release AND publishes
#                       to production PyPI (the GA release path).
#   - workflow_dispatch -> manual run with a `target` input (testpypi | pypi). Lets you
#                       dry-run the trusted-publishing handshake against TestPyPI in
#                       isolation — no tag, no GitHub Release, no Java/NAR release.
#                       Defaults to testpypi so a fat-fingered manual run can't hit
#                       production PyPI by accident.
#
# Publishing uses PyPI trusted publishing (OIDC — no long-lived token). Each PyPI
# instance needs its own publisher registered (repo + workflow `release-python.yml` +
# environment `pypi`): one on pypi.org, and (for the dry-run) one on test.pypi.org.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish (manual runs only; tag pushes always go to production PyPI)'
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install hatch
        run: pip install hatch

      - name: Build
        run: hatch build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: sdk/python/dist/*

  github-release:
    name: Attach dist to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # Only meaningful on a tag push — manual dispatch has no release to attach to.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Tag pushes -> production PyPI (empty repository-url). Manual testpypi runs
          # -> TestPyPI. Manual pypi runs also go to production.
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || '' }}
