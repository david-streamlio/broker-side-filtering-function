name: Release Python SDK

# On every v* tag, builds the Python SDK (sdk/python) once and then:
#   - attaches the wheel + sdist to the GitHub Release for the tag, and
#   - publishes them to PyPI via trusted publishing (OIDC — no long-lived token).
#
# The push/PR CI for the Python SDK (lint/type/test + a throwaway wheel artifact) stays
# in python-sdk.yml; this workflow only runs the publish paths on tags.
#
# PyPI trusted publishing requires a one-time setup on PyPI: add a GitHub publisher for
# this repo with workflow `release-python.yml` and environment `pypi`. Until then the
# `pypi` job fails, but `github-release` is independent and still attaches the artifacts.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install hatch
        run: pip install hatch

      - name: Build
        run: hatch build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: sdk/python/dist/*

  github-release:
    name: Attach dist to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
