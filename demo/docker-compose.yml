# Multi-query demo stack — runs against an existing SN Cloud cluster (or any
# Pulsar with KoP enabled). Three services:
#
#   shadowtraffic     produces synthetic stock-quote events into the source
#                     topic via KoP SASL_SSL
#   multi-query-app   registers the queries from multi-query-app/queries.yaml
#                     through the selector-filter-client-kafka SDK and prints
#                     samples of the records each filter forwards
#   observability     ghcr.io/david-streamlio/broker-side-filter-observability
#                     -- live debugger UI showing every spawned filter, drop %,
#                     and topic peek
#
# Required `.env` (or shell exports) before `docker compose up`:
#
#   PULSAR_SERVICE_URL          pulsar+ssl://pc-<id>.<region>.snio.cloud:6651
#   PULSAR_ADMIN_URL            https://pc-<id>.<region>.snio.cloud
#   KAFKA_BOOTSTRAP             pc-<id>.<region>.snio.cloud:9093
#   KAFKA_USERNAME              stock-demo-app (the stock-demo SDK SA; recreate.sh writes this)
#   DEMO_SA_PRINCIPAL           stock-demo-app@<org>.auth.streamnative.cloud
#   PULSAR_TOKEN_PATH           absolute path on the host to app.token
#   STATE_TOPIC                 persistent://control-plane/broker-filter/orchestrator-state
#   ORCHESTRATOR_TENANT         control-plane
#   ORCHESTRATOR_NAMESPACE      broker-filter
#   SHADOWTRAFFIC_LICENSE_ID    your ShadowTraffic license id
#   SHADOWTRAFFIC_LICENSE_KEY   your ShadowTraffic license key
#   DEMO_SOURCE_TOPIC_STOCKS    defaults to persistent://public/default/stock-quotes
#   DEMO_CONTROL_TOPIC          defaults to persistent://control-plane/broker-filter/filter-requests
#
# Note: the source + control topics must already exist on the cluster (or have
# auto-topic-creation enabled on their namespaces). The orchestrator must be
# deployed and running before `multi-query-app` starts registering queries.

services:
  # One-shot pre-flight: ensures the source + control topics exist and the demo SA
  # has produce+consume on the relevant namespaces. Idempotent — re-running on an
  # already-bootstrapped cluster is a no-op. Other services wait for this to
  # complete successfully before starting.
  bootstrap:
    image: apachepulsar/pulsar:4.2.1
    container_name: stock-demo-bootstrap
    restart: "no"
    environment:
      PULSAR_ADMIN_URL:       "${PULSAR_ADMIN_URL:?set in .env}"
      PULSAR_TOKEN_FILE:      "/var/run/secrets/pulsar.token"
      DEMO_SOURCE_TOPIC:      "${DEMO_SOURCE_TOPIC_STOCKS:-persistent://public/default/stock-quotes}"
      DEMO_CONTROL_TOPIC:     "${DEMO_CONTROL_TOPIC:-persistent://control-plane/broker-filter/filter-requests}"
      DEMO_SA_PRINCIPAL:      "${DEMO_SA_PRINCIPAL:?set in .env (e.g. <sa>@<org>.auth.streamnative.cloud)}"
      DEMO_SOURCE_PARTITIONS: "${DEMO_SOURCE_PARTITIONS:-1}"
    volumes:
      - ./bootstrap/bootstrap.sh:/usr/local/bin/bootstrap.sh:ro
      - ${PULSAR_TOKEN_PATH:?set in .env}:/var/run/secrets/pulsar.token:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/bootstrap.sh"]

  shadowtraffic:
    image: shadowtraffic/shadowtraffic:latest
    container_name: stock-quotes-shadowtraffic
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    # License vars (LICENSE_ID, LICENSE_EMAIL, LICENSE_ORGANIZATION,
    # LICENSE_EDITION, LICENSE_EXPIRATION, LICENSE_SIGNATURE) come from
    # license.env in this directory — see license.env.example for the shape.
    # license.env is gitignored so the actual values never get committed.
    env_file:
      - license.env
    volumes:
      - ./shadowtraffic/stock-quotes.json:/etc/shadowtraffic/stock-quotes.json:ro
      - ${PULSAR_TOKEN_PATH:?set in .env}:/var/run/secrets/pulsar.token:ro
    # The shadowtraffic image's real entrypoint is
    # `java -jar /home/shadowtraffic.jar` — there is NO `shadowtraffic` binary
    # on PATH (local-mode works precisely because it does NOT override the
    # entrypoint; it just passes --config). Cloud-mode needs SASL_SSL + the SA
    # token though, and the token is a mounted FILE — so a thin /bin/sh wrapper
    # renders the config placeholders (incl. the token) into concrete JSON,
    # then exec's the REAL jar entrypoint on the rendered file.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        TOKEN="$$(cat /var/run/secrets/pulsar.token)"
        # ShadowTraffic 1.18.2 strict-parses the file as JSON BEFORE any
        # substitution and has no placeholder templating of its own — the bare
        # unquoted throttle-ms placeholder made the file invalid JSON
        # ("Unrecognized token '$'"). The working local file just hardcodes
        # values. So render the placeholders to a concrete JSON here (busybox
        # sed; [$] = literal $, which also dodges compose interpolation), then
        # run ShadowTraffic on the rendered file.
        sed -e "s|[$]{topic}|${DEMO_SOURCE_TOPIC_STOCKS:-persistent://public/default/stock-quotes}|g" \
            -e "s|[$]{bootstrap}|${KAFKA_BOOTSTRAP}|g" \
            -e "s|[$]{throttle_ms}|5|g" \
            -e "s|[$]{username}|${KAFKA_USERNAME}|g" \
            -e "s|[$]{kafka_token}|$$TOKEN|g" \
            /etc/shadowtraffic/stock-quotes.json > /tmp/stock-quotes.rendered.json
        exec java -Djava.security.manager=allow -Dfile.encoding=UTF-8 \
          -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 \
          -XX:MaxRAMPercentage=65.0 -jar /home/shadowtraffic.jar \
          --config /tmp/stock-quotes.rendered.json

  multi-query-app:
    build:
      context: ..
      dockerfile: demo/multi-query-app/Dockerfile
    container_name: multi-query-demo
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      shadowtraffic:
        condition: service_started
    environment:
      PULSAR_SERVICE_URL:  "${PULSAR_SERVICE_URL:?set in .env}"
      PULSAR_ADMIN_URL:    "${PULSAR_ADMIN_URL:?set in .env}"
      PULSAR_TOKEN_FILE:   "/var/run/secrets/pulsar.token"
      KAFKA_BOOTSTRAP:     "${KAFKA_BOOTSTRAP:?set in .env}"
      KAFKA_USERNAME:      "${KAFKA_USERNAME:?set in .env}"
      # KAFKA_PASSWORD is the SA-token contents, fed from a docker-compose
      # `env_file:` indirection (see .env / .env.example).
      KAFKA_PASSWORD_FILE: "/var/run/secrets/pulsar.token"
      DEMO_SOURCE_TOPIC:   "${DEMO_SOURCE_TOPIC_STOCKS:-persistent://public/default/stock-quotes}"
      DEMO_CONTROL_TOPIC:  "${DEMO_CONTROL_TOPIC:-persistent://control-plane/broker-filter/filter-requests}"
      DEMO_QUERIES_PATH:   "/app/queries.yaml"
    volumes:
      - ./multi-query-app/queries.yaml:/app/queries.yaml:ro
      - ${PULSAR_TOKEN_PATH}:/var/run/secrets/pulsar.token:ro
    # KAFKA_PASSWORD isn't a real env var the JVM image reads — we shim it in via
    # an inline shell that reads the mounted token file.
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'export KAFKA_PASSWORD=$(cat /var/run/secrets/pulsar.token);
       exec java $$JAVA_OPTS -jar /app/app.jar'
    healthcheck:
      # Verify the Pulsar admin endpoint is still reachable from inside the
      # container. wget exit 6 = HTTP 401 (auth required) which means the
      # cluster IS up — treat that as healthy. Only truly unreachable (timeout,
      # DNS failure, connection refused) maps to exit 1 (unhealthy).
      test: ["CMD-SHELL", "wget -qO/dev/null --timeout=5 $$PULSAR_ADMIN_URL/admin/v2/clusters 2>&1; EC=$$?; [ $$EC -eq 0 ] || [ $$EC -eq 6 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  observability:
    image: ${OBSERVABILITY_IMAGE:-ghcr.io/david-streamlio/broker-side-filter-observability}:${OBSERVABILITY_IMAGE_TAG:-0.3.1}
    container_name: filter-observability
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      PULSAR_SERVICE_URL:        "${PULSAR_SERVICE_URL}"
      PULSAR_ADMIN_URL:          "${PULSAR_ADMIN_URL}"
      PULSAR_TOKEN_FILE:         "/var/run/secrets/pulsar.token"
      STATE_TOPIC:               "${STATE_TOPIC:?set in .env}"
      ORCHESTRATOR_TENANT:       "${ORCHESTRATOR_TENANT:?set in .env}"
      ORCHESTRATOR_NAMESPACE:    "${ORCHESTRATOR_NAMESPACE:?set in .env}"
      ORCHESTRATOR_FUNCTION:     "${ORCHESTRATOR_FUNCTION:-orchestrator}"
      HEARTBEAT_MAX_STALE_SECONDS: "${HEARTBEAT_MAX_STALE_SECONDS:-90}"
    volumes:
      # Observability needs read access to control-plane/broker-filter/
      # orchestrator-state (the UI's source of truth) and to list spawned
      # filters under control-plane/broker-filter. Neither SDK SA has that
      # scope on the locked-down control-plane tenant — only the
      # orchestrator-function SA (admin_roles of pulsar_tenant.control_plane)
      # does. Mount that token here, not the SDK PULSAR_TOKEN_PATH.
      - ${ORCHESTRATOR_PULSAR_TOKEN_PATH:?set in .env (recreate.sh writes it; points at orchestrator-function.token)}:/var/run/secrets/pulsar.token:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3200/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
