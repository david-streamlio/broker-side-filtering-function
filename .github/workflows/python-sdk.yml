name: Python SDK

# Runs lint + unit tests for sdk/python/ on every push/PR that touches Python files. The live
# integration test against an orchestrator-fronted Pulsar container is skipped here — it
# requires the pre-built filter + orchestrator NARs and Docker, which we don't wire into PR CI
# to keep wall-time fast. Run it locally with `pytest tests/integration/ -v`.

on:
  push:
    paths:
      - 'sdk/python/**'
      - 'protocol/filter-request.schema.json'
      - '.github/workflows/python-sdk.yml'
  pull_request:
    paths:
      - 'sdk/python/**'
      - 'protocol/filter-request.schema.json'
      - '.github/workflows/python-sdk.yml'

defaults:
  run:
    working-directory: sdk/python

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        # mypy 1.10+ accepts python_version >= 3.10 only; skip on older runner Pythons since
        # the strict-mode static check is the same regardless of which runtime runs it.
        if: matrix.python-version != '3.9'
        run: mypy src/

      - name: Unit tests
        run: pytest tests/ --ignore=tests/integration -v

  build-wheel:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install hatch
        run: pip install hatch

      - name: Build
        run: hatch build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pulsar-selector-filter-dist
          path: sdk/python/dist/*
          retention-days: 14
