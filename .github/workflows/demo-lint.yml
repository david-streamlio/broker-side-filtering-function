name: Demo lint

# Static checks for demo/: shell scripts, Python, JSON, YAML and the Compose files. The Java and
# Python SDK workflows' path filters skip demo/, so without this a demo-only PR gets no CI at all.
# Nothing here runs the demo: that needs a ShadowTraffic license and cloud credentials.

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/demo-lint.yml'
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/demo-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: demo

jobs:
  lint:
    name: Lint demo files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Errors only for now: the scripts on main still have shellcheck warnings (mostly unused
      # variables). Raise to --severity=warning once those are cleaned up.
      - name: shellcheck
        run: |
          shellcheck --version | grep '^version'
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck --severity=error

      - name: Shell scripts with a shebang are executable
        run: |
          status=0
          while read -r mode _ _ path; do
            if [ "$mode" != 100755 ] && head -n1 "$path" | grep -q '^#!'; then
              echo "::error file=demo/$path::has a shebang but is not executable; run: git update-index --chmod=+x demo/$path"
              status=1
            fi
          done < <(git ls-files -s '*.sh')
          exit $status

      - name: Python files compile
        run: git ls-files -z '*.py' | xargs -0 --no-run-if-empty python -m py_compile

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # The ShadowTraffic configs are templates: docker-compose renders their ${name} slots with sed
      # before use, and a slot can stand for a bare number. Parse each slot as 0.
      - name: JSON and YAML files parse
        shell: python
        run: |
          import json, re, subprocess, sys, yaml

          listed = subprocess.run(["git", "ls-files", "-z", "*.json", "*.yml", "*.yaml"],
                                  capture_output=True, text=True, check=True).stdout
          failed = False
          for path in filter(None, listed.split("\0")):
              with open(path) as f:
                  text = f.read()
              try:
                  if path.endswith(".json"):
                      json.loads(re.sub(r"\$\{\w+\}", "0", text))
                  else:
                      list(yaml.safe_load_all(text))
              except json.JSONDecodeError as e:
                  print(f"::error file=demo/{path},line={e.lineno}::{e.msg}")
                  failed = True
              except yaml.YAMLError as e:
                  mark = getattr(e, "problem_mark", None)
                  where = f",line={mark.line + 1}" if mark else ""
                  msg = " ".join(filter(None, [getattr(e, "context", None), getattr(e, "problem", None)]))
                  print(f"::error file=demo/{path}{where}::{msg or ' '.join(str(e).split())}")
                  failed = True
          sys.exit(failed)

      # Each Compose file is started on its own (`docker compose -f <file> up`), and a
      # docker-compose.override.yml is merged onto docker-compose.yml when no -f is given.
      # Interpolating with the committed examples means a required variable (${VAR:?...}) that's
      # missing from .env.example fails here.
      - name: Compose files are valid
        run: |
          cp license.env.example license.env
          status=0
          for f in docker-compose*.yml; do
            echo "== $f"
            docker compose --env-file .env.example -f "$f" config --quiet || status=1
          done
          if [ -f docker-compose.override.yml ]; then
            echo "== docker-compose.yml + docker-compose.override.yml"
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.override.yml \
              config --quiet || status=1
          fi
          exit $status
