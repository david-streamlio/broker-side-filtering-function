tenant: control-plane
namespace: broker-filter
name: orchestrator
className: io.streamnative.filter.orchestrator.OrchestratorFunction
inputs:
  # SDK-facing topic. multi-query-app publishes FilterRequest{REGISTER,MODIFY,UNREGISTER}
  # records here via selector-filter-client-kafka's Session.registerPrivateQuery /
  # updatePrivateQuery / retirePrivateQuery. Both stock-demo-app and parcel-demo-app
  # SAs have explicit per-topic produce+consume grants here (see
  # pulsar_permission_grant.{app,parcel_app}_filter_requests).
  - persistent://control-plane/broker-filter/filter-requests
processingGuarantees: ATLEAST_ONCE
# MUST be 1 — multiple orchestrator instances would race on spawn decisions.
parallelism: 1
userConfig:
  # TableView state topic — orchestrator persists per-input-topic filter function metadata
  # and per-queryId fan-out indexes here. apply-compaction below keeps the topic bounded
  # on replay.
  state-topic: persistent://control-plane/broker-filter/orchestrator-state

  # Pulsar package URL for the selector-filter NAR. recreate.sh Phase 7 uploads the NAR
  # to this URL after downloading it from the broker-side-filtering-function GitHub
  # Release — the @1.0 version tag is rewritten at deploy time to match $SELECTOR_REL.
  function-package-url: function://control-plane/broker-filter/selector-filter@1.0

  # Tenant/namespace under which spawned selector-filter function instances are deployed.
  # The orchestrator principal is admin_roles of pulsar_tenant.control_plane (see
  # infra/terraform/topics.tf) so it has tenant-admin on control-plane/* implicitly —
  # no explicit pulsar_permission_grant required for these operations.
  function-tenant: control-plane
  function-namespace: broker-filter

  # Parallelism for each spawned selector-filter instance (default: 1).
  # Increase to distribute load — requires at least as many source-topic partitions.
  function-parallelism: 1

  # Resources per spawned selector-filter instance. Keep 1 CPU : 4 GiB ratio.
  # e.g. 0.5 CPU → 2 GiB, 1.0 CPU → 4 GiB, 2.0 CPU → 8 GiB.
  function-cpu: 0.5
  function-memory-bytes: 2147483648   # 2 GiB

  apply-compaction: true
  compaction-threshold-bytes: 10485760  # 10 MB

  # Pulsar HTTP admin URL — recreate.sh templates this in from terraform output.
  pulsar-admin-url: ${PULSAR_ADMIN_URL}
  # JWT for the SA the orchestrator function runs under, used to authenticate the
  # function's owned PulsarAdmin (which spawns child selector-filter functions).
  # Required on auth-enforcing clusters (e.g. SN Cloud).
  pulsar-admin-token: ${PULSAR_ADMIN_TOKEN}

  # Idle filter GC — reclaim selector-filter instances whose queryIds have all
  # unregistered (i.e. multi-query-app shut down). Reasonable defaults for a demo.
  idle-gc-enabled: true
  idle-gc-ttl-seconds: 600            # 10 minutes
  idle-gc-sweep-interval-seconds: 60

  # Heartbeat-based dead-consumer detection — synthesizes UNREGISTER for queryIds whose
  # SDK Session has gone silent. Combined with idle-gc above, total time from consumer
  # death to filter reclaim ≈ 90 + 600 + sweep slack ≈ 12 minutes.
  heartbeat-max-stale-seconds: 90

  # Continuous existence reconcile — re-spawns filters deleted out-of-band while a query is
  # still live (the "ensure desired filters exist" controller half). Disabled by default until
  # validated on the cloud cluster; flip to true to enable self-healing of missing functions.
  existence-reconcile-enabled: false
  existence-reconcile-interval-seconds: 60
  existence-reconcile-max-attempts: 5

  # Output-producer batching delay applied to every spawned filter. The Pulsar Functions default
  # dominates the filter's value-add latency; 1ms cut median (b) latency ~3.6x (9.5 -> 2.6ms) in
  # the SelectorScalingBench study (see perf/README.md). 0 disables batching entirely.
  filter-output-batch-max-publish-delay-ms: 1

resources:
  cpu: 1.0
  ram: 1073741824   # 1 GB
