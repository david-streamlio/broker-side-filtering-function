# Demo queries — each picks a different slice of the stock-quotes stream so the
# observability UI shows distinct drop %s, message rates, and per-filter behavior.
#
# - `id` is a human-friendly label only. The SDK generates the actual queryId at
#   subscribe time; the demo app prints both so operators can correlate.
# - `selector` is JMS-style, evaluated against the message KEY (`__key__`) and
#   message PROPERTIES only — never the JSON body. ShadowTraffic emits the
#   filterable fields (exchange/sector/side) as Kafka headers, which KoP maps to
#   Pulsar message properties. Numeric selectors are intentionally avoided:
#   KoP delivers every property as a String and JMS numeric comparison on a
#   String property is UNKNOWN (no match) per spec — so the demo sticks to key
#   membership and string-equality/IN, which model real watchlist/segment
#   filtering well without that footgun.
# - `bad-syntax-demo` is intentionally broken to make the
#   `selector-compile-fail` diagnostic flag fire on cue.

queries:
  - id: tech-titans
    selector: "__key__ IN ('AAPL','MSFT','GOOGL','NVDA','META')"
    # 5 of 43 symbols ≈ 12% match → ~88% drop

  - id: bank-watch
    selector: "__key__ IN ('JPM','BAC','GS','MS','C','WFC')"
    # 6 of 43 ≈ 14% match → ~86% drop

  - id: nasdaq-only
    selector: "exchange = 'NASDAQ'"
    # 50/50 venue split → ~50% drop

  - id: healthcare-sector
    selector: "sector = 'healthcare'"
    # 1 of 6 sectors → ~83% drop

  - id: nyse-sells
    selector: "exchange = 'NYSE' AND side = 'S'"
    # 50% venue × 50% side ≈ 25% match → ~75% drop

  - id: energy-or-industrial
    selector: "sector IN ('energy','industrial')"
    # 2 of 6 sectors ≈ 33% match → ~67% drop

  - id: sell-side-tech
    selector: "side = 'S' AND sector = 'tech'"
    # 50% × 17% ≈ 8% match → ~92% drop

  - id: buy-side-finance
    selector: "side = 'B' AND sector = 'finance'"
    # 50% × 17% ≈ 8% match → ~92% drop

  - id: bad-syntax-demo
    selector: "this is not a valid selector ("
    # intentionally bad — fires selector-compile-fail in the observability UI
